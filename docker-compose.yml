services:
  # Postgres est embarqué DANS l'image web (docker-entrypoint.sh gère init/migrations/seed
  # avant de démarrer Next.js) — choix explicite et temporaire pour la simplicité d'un seul
  # conteneur. À séparer plus tard (voir doc/technique/architecture.md). worker s'y connecte
  # par le réseau compose interne (host "web", port 5432 — jamais exposé à l'extérieur).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      - web_pgdata:/app/pgdata
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@web:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Fournisseur LLM local pour le dev [Q37] — profil "dev" uniquement, jamais démarré en prod.
  # Lancer avec : docker compose --profile dev up
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["dev"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  web_pgdata:
  redis_data:
  ollama_data:
  caddy_data:
